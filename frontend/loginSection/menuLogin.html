    <h1 id="titulo-administracion">Sección administrador</h1>

    <section id="menu-administracion">
      <div class="box-menu-administracion">
        <!---Primera caja "Buscar Usarios"-->
        <div class="box-option-administracion">
          <div id="box-img-busquedaUsuarios">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
          <p>Buscar Usuarios</p>
          <button
            id="button-buscarUsuario"
            class="button-option-admin"
            type="submit"
          >
            Ir
          </button>
        </div>
        <!---Segunda Caja "Libros Vencidos" ---->
        <div class="box-option-administracion">
          <div id="box-img-libroVencidos">
            <i class="fa-solid fa-x"></i>
          </div>
          <p>Libros Vencidos</p>
          <button
            id="button-libroVencidos"
            class="button-option-admin"
            type="submit"
          >
            Ir
          </button>
        </div>
        <!---Tercera Section "Libros Activos" --->
        <div class="box-option-administracion">
          <div id="box-img-librosActivos">
            <i class="fa-solid fa-check"></i>
          </div>
          <p>Libros Activos</p>
          <button
            id="button-libroActivos"
            class="button-option-admin"
            type="submit"
          >
            Ir
          </button>
        </div>
        <!--Cuarta Caja "Multas" ---->
        <div class="box-option-administracion">
          <div id="box-img-multas">
            <i class="fa-solid fa-book"></i>
          </div>
          <p>Multas</p>
          <button
            id="button-multasAdmin"
            class="button-option-admin"
            type="submit"
          >
            Ir
          </button>
        </div>
      </div>
    </section>
