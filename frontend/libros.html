>

    <title>Escritores</title>
    <link href="styles/styles.css" rel="stylesheet">
  </head>
  <body>
    <!--Seccion de Cabeza de la página y menu-->
    <header>
      <div id="boxHeaderMenu">
        <div id="boxTitulo">
          <p>Biblioteca Santa Fe</p>
        </div>
        <!-- Botón hamburguesa — solo visible en móvil -->
        <button id="btn-hamburguesa" aria-label="Menú">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="boxMenu">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="libros.html">Libros</a></li>
            <li><a href="premioNobel.html">Nobels</a></li>
            <li><a href="generos.html">Generos</a></li>
            <li><a href="administradores.html">Login</a></li>
          </ul>
        </div>
      </div>
    </header>

    <!--Este filtro sirve para buscar por nombre del autor-->
    <section id="filtro-libro-autor-section">
      <div id="box-filtro-autor-libro-section">
        <label id="busqueda-escritor-titulo-libro" for="Busqueda"
          >Busqueda por Escritor</label
        >

        <div class="box-filtros-libros-section">
          <input
            id="busqueda-autor-libro-section"
            type="text"
            placeholder="Buscar por Escritor..."
            name=""
            value=""
            list="sugerencias-autores"
>
          <datalist id="sugerencias-autores"> </datalist>

          <button id="button-autor-libro-section" type="submit">Buscar</button>
          <!--Botón reset -->
          <button type="reset" id="button-reset-auto-libro">Limipiar</button>
        </div>
      </div>
    </section>

    <section id="libros-section">
      <!-- Aquí JS va a insertar las cartas -->
      <div id="contenedor-libros"></div>

      <!-- El template define la estructura, no los datos -->
      <template id="template-libro">
        <div class="carta-libro">
          <div class="box-img-libroSection">
            <img src="" alt="" class="portada">
          </div>
          <div class="box-info-libroSection">
            <h3 class="titulo"></h3>
            <p class="autor"></p>
            <p class="sinopsis"></p>
            <br>
            <span class="genero"></span>
            <br>
            <span class="anio"></span>
          </div>
        </div>
      </template>
    </section>

    <footer>
      <div id="pieDePagina">
        <a href="https://facebook.com/" target="_blank"
          ><i class="fa-brands fa-square-facebook"></i
        ></a>
        <a href="https://instagram.com" target="_blank"
          ><i class="fa-brands fa-instagram"></i
        ></a>
        <a href="#" target="_blank"><i class="fa-brands fa-pinterest"></i></a>
      </div>
      <p>TODO ESTO ES MERO ACADEMICO</p>
      <div id="copyright">
        <small>
          &copy 2018.Orlando José - SimplicityTree. Derechos reservados.
        </small>
      </div>
    </footer>

    <script src="JavaScript/script.js"></script>

      crossorigin="anonymous"
    ></script>
  </body>
</html>
